<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Suggest a Technology</title>
</head>
<body>
<h1>Emerging Technologies Information Portal</h1>
<p>Suggest a New Technology</p>
<p><a href="#">Home</a> | <a href="suggest.html">Suggest Technology</a></p>
<hr>
<h2>Technology Suggestion Form</h2>
<form action="#" method="post">
  <label>Name:</label><br>
  <input type="text" name="name" id="name"><br><br>

  <label>Email:</label><br>
  <input type="email" name="email" id="email"><br><br>

  <label>Contact Number:</label><br>
  <input type="tel" name="contact" id="contact" maxlength="10"><br><br>

  <label>Technology Name:</label><br>
  <input type="text" name="techname" id="techname"><br><br>

  <label>Technology Category:</label><br>
  <select name="category" id="category">
    <option value="">-- Select Category --</option>
    <option>Artificial Intelligence</option>
    <option>Cloud Computing</option>
    <option>Cyber Security</option>
    <option>IoT</option>
    <option>Blockchain</option>
  </select><br><br>

  <label>Technology Impact Level:</label><br>
  <input type="radio" name="impact" value="High"> High
  <input type="radio" name="impact" value="Medium"> Medium
  <input type="radio" name="impact" value="Low"> Low<br><br>

  <label>Technology Type:</label><br>
  <input type="radio" name="type" value="Software"> Software
  <input type="radio" name="type" value="Hardware"> Hardware<br><br>

  <label>Application Areas:</label><br>
  <input type="checkbox" name="areas[]" value="Education"> Education
  <input type="checkbox" name="areas[]" value="Healthcare"> Healthcare
  <input type="checkbox" name="areas[]" value="Finance"> Finance
  <input type="checkbox" name="areas[]" value="Industry"> Industry<br><br>

  <label>Year Introduced:</label><br>
  <input type="number" name="year" id="year" min="1900" max="2030"><br><br>

  <label>Technology Website:</label><br>
  <input type="url" name="website" id="website"><br><br>

  <label>Date of Submission:</label><br>
  <input type="date" name="date" id="date"><br><br>

  <label>Description:</label><br>
  <textarea name="description" id="description" rows="5" cols="40"></textarea><br><br>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">
</form>
<hr>
<p>Emerging Technologies Information Portal | Web Programming Laboratory</p>
</body>
</html>
